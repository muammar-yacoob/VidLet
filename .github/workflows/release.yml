name: Publish to npm

on:
  push:
    paths:
      - 'src/**'
      - 'package.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # --ignore-scripts: the postinstall hook runs `node dist/cli.js install`,
      # which doesn't exist until the build step below. Without this, CI dies
      # during install and never publishes (broken for 26+ days). End users are
      # unaffected — the published tarball ships a prebuilt dist/.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check if version changed
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view @spark-apps/vidlet version 2>/dev/null || echo "0.0.0")
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Version changed: $NPM_VERSION -> $PACKAGE_VERSION"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $PACKAGE_VERSION"
          fi

      # Authenticated by OIDC trusted publishing, not a long-lived NPM_TOKEN:
      # 2FA-bypass granular tokens lose direct-publish rights in Jan 2027.
      # Provenance is implied by trusted publishing, so no --provenance flag.
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public

      - name: Skip publish (version unchanged)
        if: steps.version_check.outputs.should_publish == 'false'
        run: echo "Skipping publish - version already exists on npm"
